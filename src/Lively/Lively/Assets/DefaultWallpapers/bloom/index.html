<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070d08" />
  <title>花间萤火</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #060a06;
      overflow: hidden;
    }

    body {
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(100% 90% at 50% 52%, rgba(0, 0, 0, 0) 36%, rgba(0, 0, 0, .34) 74%, rgba(0, 0, 0, .72) 100%);
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <script>
    (function () {
      'use strict';

      var TAU = Math.PI * 2;
      var canvas = document.getElementById('scene');
      var ctx = canvas.getContext('2d', { alpha: false });
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var W = 0, H = 0, dpr = 1, bg = null;
      var pointer = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5, active: false };
      var flies = [], bokeh = [], gusts = [];
      var glowSprite = null;
      var lastInput = performance.now(), eco = 0, lastDraw = 0, time = 0;
      var breeze = 0;

      function markInput() {
        lastInput = performance.now();
        eco = 0;
      }

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }

      function buildGlow() {
        glowSprite = document.createElement('canvas');
        glowSprite.width = 64;
        glowSprite.height = 64;
        var g = glowSprite.getContext('2d');
        var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(255, 255, 214, 1)');
        grad.addColorStop(0.22, 'rgba(214, 255, 170, 0.62)');
        grad.addColorStop(0.6, 'rgba(120, 230, 130, 0.16)');
        grad.addColorStop(1, 'rgba(60, 180, 90, 0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, 64, 64);
      }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        bg = ctx.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, Math.max(W, H) * 0.75);
        bg.addColorStop(0, '#0d1a10');
        bg.addColorStop(0.5, '#08110b');
        bg.addColorStop(1, '#030604');

        makeBokeh();
        makeFlies();
      }

      function makeBokeh() {
        bokeh = [];
        for (var i = 0; i < 12; i++) {
          bokeh.push({
            x: Math.random(),
            y: rand(0.2, 0.9),
            r: rand(0.03, 0.11),
            speed: rand(0.002, 0.007),
            phase: rand(0, TAU),
            alpha: rand(0.025, 0.07)
          });
        }
      }

      function makeFlies() {
        var count = Math.round(Math.min(80, Math.max(28, W * H / 26000)));
        flies = [];
        for (var i = 0; i < count; i++) {
          flies.push({
            x: Math.random(),
            y: rand(0.15, 1),
            vx: rand(-0.01, 0.01),
            vy: rand(-0.008, 0.008),
            size: rand(0.5, 1.5),
            phase: rand(0, TAU),
            blink: rand(0.4, 1.6),
            hue: rand(64, 96)
          });
        }
      }

      function scatter(nx, ny) {
        var cx = nx, cy = ny;
        for (var i = 0; i < flies.length; i++) {
          var f = flies[i];
          var dx = f.x - cx, dy = f.y - cy;
          var d = Math.sqrt(dx * dx + dy * dy) + 0.001;
          if (d < 0.34) {
            var force = (0.34 - d) * 0.5;
            f.vx += dx / d * force;
            f.vy += dy / d * force;
          }
        }
        gusts.push({ x: cx, y: cy, r: 0, life: 1 });
      }

      function update(dt) {
        pointer.sx += (pointer.x - pointer.sx) * Math.min(1, dt * 3);
        pointer.sy += (pointer.y - pointer.sy) * Math.min(1, dt * 3);
        breeze = Math.max(0, breeze - dt * 0.5);
        var wanderScale = 1 + breeze * 1.6;

        for (var i = 0; i < flies.length; i++) {
          var f = flies[i];
          f.vx += (Math.random() - 0.5) * 0.0035 * dt * wanderScale;
          f.vy += (Math.random() - 0.5) * 0.0035 * dt * wanderScale;
          f.vx *= 0.985;
          f.vy *= 0.985;
          if (pointer.active) {
            var dx = pointer.sx - f.x;
            var dy = pointer.sy - f.y;
            var d = Math.sqrt(dx * dx + dy * dy) + 0.001;
            if (d < 0.28) {
              f.vx += dx / d * 0.0026 * dt;
              f.vy += dy / d * 0.0026 * dt;
            }
          }
          f.x += f.vx;
          f.y += f.vy;
          if (f.x < 0.02) { f.x = 0.02; f.vx = Math.abs(f.vx); }
          if (f.x > 0.98) { f.x = 0.98; f.vx = -Math.abs(f.vx); }
          if (f.y < 0.08) { f.y = 0.08; f.vy = Math.abs(f.vy); }
          if (f.y > 0.98) { f.y = 0.98; f.vy = -Math.abs(f.vy); }
        }

        for (var j = gusts.length - 1; j >= 0; j--) {
          var g = gusts[j];
          g.r += dt * 0.5;
          g.life -= dt * 0.7;
          if (g.life <= 0) gusts.splice(j, 1);
        }
      }

      function draw() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.globalCompositeOperation = 'lighter';
        for (var i = 0; i < bokeh.length; i++) {
          var b = bokeh[i];
          b.x += 0;
          var bx = (b.x + Math.sin(time * b.speed * 6 + b.phase) * 0.02) * W;
          var by = (b.y + Math.cos(time * b.speed * 5 + b.phase) * 0.012) * H;
          var br = b.r * Math.min(W, H);
          var grad = ctx.createRadialGradient(bx, by, 0, bx, by, br);
          grad.addColorStop(0, 'rgba(150, 255, 170, ' + b.alpha + ')');
          grad.addColorStop(1, 'rgba(60, 160, 90, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(bx, by, br, 0, TAU);
          ctx.fill();
        }

        for (var j = 0; j < flies.length; j++) {
          var f = flies[j];
          var pulse = 0.55 + 0.45 * Math.sin(time * f.blink * 2.2 + f.phase);
          var size = f.size * Math.min(W, H) * 0.009 * (0.75 + pulse * 0.5);
          ctx.globalAlpha = pulse;
          ctx.drawImage(glowSprite, f.x * W - size, f.y * H - size, size * 2, size * 2);
          ctx.globalAlpha = 1;
        }
        ctx.globalCompositeOperation = 'source-over';

        for (var k = 0; k < gusts.length; k++) {
          var g = gusts[k];
          ctx.strokeStyle = 'rgba(190, 255, 190, ' + (g.life * 0.18) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(g.x * W, g.y * H, g.r * Math.max(W, H) * 0.5, 0, TAU);
          ctx.stroke();
        }
      }

      function frame(now) {
        var idle = now - lastInput;
        var target = idle > 4000 ? 1 : 0;
        eco += (target - eco) * 0.05;
        var targetFps = 60 - eco * 40;
        var step = 1000 / targetFps;
        if (now - lastDraw < step - 1) {
          requestAnimationFrame(frame);
          return;
        }
        var dt = Math.min(0.1, (now - lastDraw) / 1000);
        lastDraw = now;
        time += reduceMotion ? 0 : dt;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', function (e) {
        pointer.x = e.clientX / Math.max(1, W);
        pointer.y = e.clientY / Math.max(1, H);
        pointer.active = true;
        markInput();
      });
      window.addEventListener('pointerleave', function () {
        pointer.active = false;
        pointer.x = 0.5;
        pointer.y = 0.5;
      });
      window.addEventListener('pointerdown', function (e) {
        scatter(e.clientX / Math.max(1, W), e.clientY / Math.max(1, H));
        markInput();
      });
      window.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') {
          breeze = 1;
          for (var i = 0; i < flies.length; i++) {
            flies[i].vx += rand(-0.02, 0.02);
            flies[i].vy += rand(-0.016, 0.016);
          }
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          var dir = e.key === 'ArrowLeft' ? -1 : 1;
          for (var j = 0; j < flies.length; j++) flies[j].vx += dir * 0.006;
        }
        markInput();
      });

      buildGlow();
      resize();
      frame(performance.now());
    })();
  </script>
</body>

</html>
