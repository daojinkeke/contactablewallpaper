<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>墨影涟漪</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #080809;
      overflow: hidden;
    }

    body {
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(95% 92% at 50% 50%, rgba(0, 0, 0, 0) 44%, rgba(0, 0, 0, .32) 76%, rgba(0, 0, 0, .7) 100%);
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <script>
    (function () {
      'use strict';

      var TAU = Math.PI * 2;
      var canvas = document.getElementById('scene');
      var ctx = canvas.getContext('2d', { alpha: false });
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var W = 0, H = 0, dpr = 1, bg = null, sprite = null;
      var pointer = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5, active: false };
      var plumes = [], rings = [];
      var lastInput = performance.now(), eco = 0, lastDraw = 0, time = 0;
      var swirl = 1;

      function markInput() {
        lastInput = performance.now();
        eco = 0;
      }

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }

      function buildSprite() {
        sprite = document.createElement('canvas');
        sprite.width = 64;
        sprite.height = 64;
        var g = sprite.getContext('2d');
        var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(238, 238, 232, 1)');
        grad.addColorStop(0.3, 'rgba(200, 200, 196, 0.42)');
        grad.addColorStop(0.7, 'rgba(140, 140, 138, 0.12)');
        grad.addColorStop(1, 'rgba(90, 90, 90, 0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, 64, 64);
      }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        bg = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
        bg.addColorStop(0, '#131315');
        bg.addColorStop(0.55, '#0b0b0d');
        bg.addColorStop(1, '#050506');

        seedPlumes();
      }

      function seedPlumes() {
        var count = Math.round(Math.min(160, Math.max(60, W * H / 9000)));
        plumes = [];
        for (var i = 0; i < count; i++) {
          if (i < count * 0.35) {
            var a = Math.random() * TAU;
            var r = Math.pow(Math.random(), 1.6) * 0.22;
            plumes.push(newPlume(0.5 + Math.cos(a) * r, 0.52 + Math.sin(a) * r * 0.7, rand(0.6, 1)));
          } else {
            plumes.push(newPlume(Math.random(), rand(0.05, 1), rand(0.4, 1)));
          }
        }
      }

      function newPlume(x, y, life) {
        return {
          x: x,
          y: y,
          vx: rand(-0.006, 0.006),
          vy: rand(-0.006, 0.006),
          size: rand(0.012, 0.055),
          life: life,
          decay: rand(0.02, 0.07),
          alpha: rand(0.12, 0.42),
          spin: rand(-1, 1)
        };
      }

      function drop(nx, ny) {
        for (var i = 0; i < 40; i++) {
          plumes.push(newPlume(nx + rand(-0.02, 0.02), ny + rand(-0.02, 0.02), 1));
        }
        rings.push({ x: nx, y: ny, r: 0, life: 0.9 });
      }

      function update(dt) {
        pointer.sx += (pointer.x - pointer.sx) * Math.min(1, dt * 2.6);
        pointer.sy += (pointer.y - pointer.sy) * Math.min(1, dt * 2.6);
        var push = pointer.active ? 1 : 0.35;

        for (var i = 0; i < plumes.length; i++) {
          var p = plumes[i];
          p.life -= p.decay * dt;
          if (p.life <= 0) {
            p.x = Math.random();
            p.y = Math.random();
            p.life = 1;
            p.size = rand(0.006, 0.03);
            continue;
          }
          var dx = p.x - pointer.sx;
          var dy = p.y - pointer.sy;
          var d = Math.sqrt(dx * dx + dy * dy) + 0.001;
          var near = Math.max(0, 1 - d * 2.8) * push;
          p.vx += (-dy / d) * near * 0.012 * swirl * dt;
          p.vy += (dx / d) * near * 0.012 * swirl * dt;
          p.vx += Math.sin(time * 0.6 + p.y * 8) * 0.0012 * dt;
          p.vy += Math.cos(time * 0.5 + p.x * 9) * 0.0012 * dt;
          p.vx *= 0.995;
          p.vy *= 0.995;
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > 1 || p.y < 0 || p.y > 1) {
            p.x = Math.random();
            p.y = Math.random();
            p.vx = rand(-0.006, 0.006);
            p.vy = rand(-0.006, 0.006);
          }
        }

        for (var j = rings.length - 1; j >= 0; j--) {
          var r = rings[j];
          r.r += dt * 0.16;
          r.life -= dt * 0.32;
          if (r.life <= 0) rings.splice(j, 1);
        }
      }

      function draw() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.globalCompositeOperation = 'lighter';
        for (var i = 0; i < plumes.length; i++) {
          var p = plumes[i];
          var s = p.size * Math.min(W, H) * (0.75 + p.life * 0.7);
          ctx.globalAlpha = p.alpha * p.life;
          ctx.drawImage(sprite, p.x * W - s, p.y * H - s, s * 2, s * 2);
        }
        ctx.globalAlpha = 1;

        for (var j = 0; j < rings.length; j++) {
          var r = rings[j];
          ctx.strokeStyle = 'rgba(222, 222, 216, ' + (r.life * 0.35) + ')';
          ctx.lineWidth = 0.8 + r.life * 1.6;
          ctx.beginPath();
          ctx.arc(r.x * W, r.y * H, r.r * Math.max(W, H), 0, TAU);
          ctx.stroke();
        }

        ctx.globalCompositeOperation = 'source-over';
      }

      function frame(now) {
        var idle = now - lastInput;
        var target = idle > 4000 ? 1 : 0;
        eco += (target - eco) * 0.05;
        var targetFps = 60 - eco * 40;
        var step = 1000 / targetFps;
        if (now - lastDraw < step - 1) {
          requestAnimationFrame(frame);
          return;
        }
        var dt = Math.min(0.1, (now - lastDraw) / 1000);
        lastDraw = now;
        time += reduceMotion ? 0 : dt;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', function (e) {
        pointer.x = e.clientX / Math.max(1, W);
        pointer.y = e.clientY / Math.max(1, H);
        pointer.active = true;
        markInput();
      });
      window.addEventListener('pointerleave', function () {
        pointer.active = false;
        pointer.x = 0.5;
        pointer.y = 0.5;
      });
      window.addEventListener('pointerdown', function (e) {
        drop(e.clientX / Math.max(1, W), e.clientY / Math.max(1, H));
        markInput();
      });
      window.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') {
          drop(0.5, 0.52);
        } else if (e.key === 'ArrowLeft') {
          swirl = -1;
        } else if (e.key === 'ArrowRight') {
          swirl = 1;
        }
        markInput();
      });

      buildSprite();
      resize();
      frame(performance.now());
    })();
  </script>
</body>

</html>
