<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060c" />
  <title>棱镜回响</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #04050a;
      overflow: hidden;
    }

    body {
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(90% 90% at 50% 50%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, .38) 78%, rgba(0, 0, 0, .74) 100%);
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <script>
    (function () {
      'use strict';

      var TAU = Math.PI * 2;
      var canvas = document.getElementById('scene');
      var ctx = canvas.getContext('2d', { alpha: false });
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var W = 0, H = 0, dpr = 1, bg = null;
      var pointer = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5, active: false };
      var rings = [];
      var lastInput = performance.now(), eco = 0, lastDraw = 0, time = 0;
      var hueShift = 0, spin = 0, spinSpeed = 0.06;

      function markInput() {
        lastInput = performance.now();
        eco = 0;
      }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        bg = ctx.createRadialGradient(W * 0.5, H * 0.48, 0, W * 0.5, H * 0.48, Math.max(W, H) * 0.78);
        bg.addColorStop(0, '#0c1022');
        bg.addColorStop(0.5, '#060814');
        bg.addColorStop(1, '#03040a');
      }

      function addRing(x, y) {
        rings.push({ x: x, y: y, r: 0, life: 1 });
      }

      function update(dt) {
        pointer.sx += (pointer.x - pointer.sx) * Math.min(1, dt * 3.2);
        pointer.sy += (pointer.y - pointer.sy) * Math.min(1, dt * 3.2);

        spin += dt * spinSpeed * (pointer.active ? 1 + (pointer.sx - 0.5) * 0.9 : 1);
        for (var i = rings.length - 1; i >= 0; i--) {
          var r = rings[i];
          r.r += dt * 0.42;
          r.life -= dt * 0.5;
          if (r.life <= 0) rings.splice(i, 1);
        }
      }

      function beam(cx, cy, angle, length, width, hue, alpha) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        var g = ctx.createLinearGradient(0, 0, 0, length);
        g.addColorStop(0, 'hsla(' + hue + ', 92%, 66%, ' + (alpha * 0.9) + ')');
        g.addColorStop(0.6, 'hsla(' + hue + ', 88%, 58%, ' + (alpha * 0.28) + ')');
        g.addColorStop(1, 'hsla(' + hue + ', 85%, 55%, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-width, length);
        ctx.lineTo(width, length);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        var cx = W * (0.5 + (pointer.sx - 0.5) * 0.1);
        var cy = H * (0.5 + (pointer.sy - 0.5) * 0.08);
        var radius = Math.max(W, H) * 0.72;

        ctx.globalCompositeOperation = 'lighter';

        var beams = 9;
        for (var i = 0; i < beams; i++) {
          var hue = (hueShift + i * 40) % 360;
          var angle = spin + i * TAU / beams + Math.sin(time * 0.5 + i) * 0.06;
          beam(cx, cy, angle, radius, 26 + Math.sin(time * 0.8 + i) * 8,
            hue, 0.12 + 0.04 * Math.sin(time * 1.1 + i * 1.7));
        }

        var coreHue = (hueShift + 190) % 360;
        var core = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
        core.addColorStop(0, 'hsla(' + coreHue + ', 100%, 92%, 0.85)');
        core.addColorStop(0.18, 'hsla(' + coreHue + ', 96%, 70%, 0.35)');
        core.addColorStop(1, 'hsla(' + coreHue + ', 90%, 60%, 0)');
        ctx.fillStyle = core;
        ctx.fillRect(cx - 140, cy - 140, 280, 280);

        for (var k = 0; k < rings.length; k++) {
          var r = rings[k];
          var ringHue = (hueShift + 120) % 360;
          ctx.strokeStyle = 'hsla(' + ringHue + ', 90%, 72%, ' + (r.life * 0.55) + ')';
          ctx.lineWidth = 1.4 + r.life * 2.4;
          ctx.beginPath();
          ctx.arc(r.x * W, r.y * H, r.r * Math.max(W, H) * 0.6, 0, TAU);
          ctx.stroke();
        }

        ctx.globalCompositeOperation = 'source-over';
      }

      function frame(now) {
        var idle = now - lastInput;
        var target = idle > 4000 ? 1 : 0;
        eco += (target - eco) * 0.05;
        var targetFps = 60 - eco * 40;
        var step = 1000 / targetFps;
        if (now - lastDraw < step - 1) {
          requestAnimationFrame(frame);
          return;
        }
        var dt = Math.min(0.1, (now - lastDraw) / 1000);
        lastDraw = now;
        time += reduceMotion ? 0 : dt * 0.6;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', function (e) {
        pointer.x = e.clientX / Math.max(1, W);
        pointer.y = e.clientY / Math.max(1, H);
        pointer.active = true;
        markInput();
      });
      window.addEventListener('pointerleave', function () {
        pointer.active = false;
        pointer.x = 0.5;
        pointer.y = 0.5;
      });
      window.addEventListener('pointerdown', function (e) {
        addRing(e.clientX / Math.max(1, W), e.clientY / Math.max(1, H));
        markInput();
      });
      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') hueShift = (hueShift - 24 + 360) % 360;
        else if (e.key === 'ArrowRight') hueShift = (hueShift + 24) % 360;
        else if (e.key === 'ArrowUp') spinSpeed = Math.min(0.26, spinSpeed + 0.02);
        else if (e.key === 'ArrowDown') spinSpeed = Math.max(-0.26, spinSpeed - 0.02);
        else if (e.key === ' ') addRing(0.5, 0.5);
        markInput();
      });

      resize();
      frame(performance.now());
    })();
  </script>
</body>

</html>
