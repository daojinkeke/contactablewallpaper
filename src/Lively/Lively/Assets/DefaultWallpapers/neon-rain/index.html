<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07060f" />
  <title>霓虹雨夜</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07060f;
      user-select: none;
      -webkit-user-select: none;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #scene {
      position: fixed;
      inset: 0;
      /* 显式宽高：避免替换元素退回固有尺寸导致高分屏裁切与点击偏移 */
      width: 100%;
      height: 100%;
      display: block;
      animation: appear 1.4s ease .05s both;
    }

    @media (prefers-reduced-motion: reduce) {
      #scene { animation: none; }
    }

    .clockwrap {
      position: fixed;
      left: min(5.4vw, 56px);
      bottom: min(5.2vh, 46px);
      z-index: 4;
      pointer-events: none;
      transition: opacity 1.1s ease, transform 1.1s ease;
      opacity: 1;
      transform: translateY(0);
    }

    .clockwrap.hidden {
      opacity: 0;
      transform: translateY(12px);
    }

    .clockwrap::before {
      content: '';
      position: absolute;
      left: -15px;
      top: 6px;
      bottom: 10px;
      width: 2px;
      background: linear-gradient(180deg, #4fd6ff, #ff4f9a);
      box-shadow: 0 0 14px rgba(79, 214, 255, .55);
      opacity: .85;
    }

    .clock {
      font-family: "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
      font-size: clamp(34px, 4.2vw, 56px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: .06em;
      font-variant-numeric: tabular-nums;
      color: #e2fbff;
      text-shadow: 0 0 16px rgba(79, 214, 255, .55), 0 0 42px rgba(255, 79, 154, .26);
    }

    .clock .sec {
      font-size: .40em;
      letter-spacing: .14em;
      margin-left: .20em;
      color: rgba(120, 226, 255, .78);
    }

    .date {
      margin-top: 12px;
      font-family: "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
      font-size: 11px;
      letter-spacing: .26em;
      color: rgba(148, 222, 244, .62);
      text-shadow: 0 0 12px rgba(79, 214, 255, .35);
    }

    @media (prefers-reduced-motion: reduce) {
      .clockwrap { transition: none; }
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>
  <div class="clockwrap" id="clockwrap">
    <div class="clock"><span id="clock-main">--:--</span><span class="sec" id="clock-sec">--</span></div>
    <div class="date" id="clock-date"></div>
  </div>
  <script>
    (function () {
      'use strict';

      var canvas = document.getElementById('scene');
      var ctx = canvas.getContext('2d', { alpha: false });
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var W = 0, H = 0, DPR = 1;
      var STREET = 0.802;
      var elapsed = 0, lastTs = 0, dt = 16;

      function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
      function rand(a, b) { return a + Math.random() * (b - a); }
      function lerp(a, b, t) { return a + (b - a) * t; }

      function mulberry(seed) {
        var s = seed >>> 0;
        return function () {
          s = (s + 0x6D2B79F5) | 0;
          var t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /* =====================================================================
       * 1. 宿主环境
       * ===================================================================== */
      var envState = {
        hour: 22, isDay: false,
        cond: 'rain', code: 61,
        temp: 12, wind: 8, humidity: 78,
        cloud: 0.86, light: 0.05, warmth: -0.2,
        weatherKnown: false
      };

      var clockOffset = 0;
      var clockReady = false;

      var CODE_MAP = {
        0: 'clear', 1: 'partly', 2: 'partly', 3: 'cloudy',
        45: 'fog', 48: 'fog',
        51: 'drizzle', 53: 'drizzle', 55: 'drizzle', 56: 'drizzle', 57: 'drizzle',
        61: 'rain', 63: 'rain', 65: 'rain', 66: 'rain', 67: 'rain',
        71: 'snow', 73: 'snow', 75: 'snow', 77: 'snow',
        80: 'rain', 81: 'rain', 82: 'rain', 85: 'snow', 86: 'snow',
        95: 'thunder', 96: 'thunder', 99: 'thunder'
      };
      var CLOUD_BY_COND = {
        clear: 0.04, partly: 0.40, cloudy: 0.80, fog: 0.64,
        drizzle: 0.68, rain: 0.86, snow: 0.80, thunder: 0.94
      };

      function condFromWeather(w) {
        if (!w) return null;
        if (w.conditionCode !== undefined && CODE_MAP[w.conditionCode] !== undefined)
          return CODE_MAP[w.conditionCode];
        var c = String(w.condition || '').toLowerCase();
        if (c.indexOf('thunder') >= 0) return 'thunder';
        if (c.indexOf('snow') >= 0) return 'snow';
        if (c.indexOf('rain') >= 0 || c.indexOf('drizzle') >= 0) return 'rain';
        if (c.indexOf('fog') >= 0 || c.indexOf('mist') >= 0) return 'fog';
        if (c.indexOf('cloud') >= 0 || c.indexOf('overcast') >= 0) return 'cloudy';
        if (c.indexOf('clear') >= 0 || c.indexOf('sun') >= 0) return 'clear';
        return null;
      }

      function applyEnv() {
        var raw = (window.contactableEnv && typeof window.contactableEnv === 'object')
          ? window.contactableEnv : null;
        var t = raw && raw.time && typeof raw.time === 'object' ? raw.time : null;
        var w = raw && raw.weather && typeof raw.weather === 'object' ? raw.weather : null;

        if (!clockReady) {
          clockReady = true;
          if (t && t.iso) {
            var d = new Date(t.iso);
            if (!isNaN(d.getTime())) clockOffset = d.getTime() - Date.now();
          }
        }

        var tz = (t && typeof t.timezoneOffsetMinutes === 'number')
          ? t.timezoneOffsetMinutes : -new Date().getTimezoneOffset();
        var local = new Date(Date.now() + clockOffset + tz * 60000);
        envState.hour = local.getUTCHours() + local.getUTCMinutes() / 60;
        envState.isDay = (t && typeof t.isDay === 'boolean')
          ? t.isDay : (envState.hour >= 6 && envState.hour < 18);

        if (w) {
          envState.cond = condFromWeather(w) || 'clear';
          envState.code = w.conditionCode || 0;
          if (typeof w.temperatureC === 'number') envState.temp = w.temperatureC;
          if (typeof w.windKph === 'number') envState.wind = w.windKph;
          if (typeof w.humidity === 'number') envState.humidity = w.humidity;
          envState.weatherKnown = true;
        } else {
          envState.weatherKnown = false;
          envState.cond = 'clear';
          envState.code = 0;
          envState.wind = 6;
          envState.humidity = 60;
        }

        envState.cloud = CLOUD_BY_COND[envState.cond] || 0.06;
        envState.light = clamp(sunCurve(envState.hour) * (1 - envState.cloud * 0.42), 0.02, 1);
        envState.warmth = (envState.hour < 9 || envState.hour > 16) ? 0.5 : 0.1;

        buildSky();
      }

      function sunCurve(h) {
        var rise = 6.0, set = 18.0;
        if (h < rise - 0.8 || h > set + 0.8) return 0.02;
        var p = clamp((h - rise) / (set - rise), 0, 1);
        return Math.pow(Math.sin(p * Math.PI), 0.9);
      }

      /* =====================================================================
       * 2. 天色
       * ===================================================================== */
      var SKY_KEYS = [
        [0.0, '#05060f', '#0b0a1a', '#1d0f28'],
        [4.6, '#060711', '#0d0b1d', '#22122c'],
        [6.0, '#241b34', '#4a3350', '#b06a78'],
        [7.6, '#3a3a52', '#6a6274', '#a893a2'],
        [12.0, '#4a4658', '#6d6878', '#9a93a0'],
        [16.6, '#434056', '#6b6074', '#a2879a'],
        [17.9, '#2a1730', '#552744', '#9c4557'],
        [19.2, '#130d22', '#25132f', '#4a1c3a'],
        [20.6, '#070811', '#0f0b20', '#251232'],
        [24.0, '#05060f', '#0b0a1a', '#1d0f28']
      ];

      var sky = { top: '#05060f', mid: '#0b0a1a', horizon: '#1d0f28' };

      function hexToRgb(h) {
        return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
      }
      function rgbToHex(c) {
        return '#' + c.map(function (v) {
          var s = Math.round(clamp(v, 0, 255)).toString(16);
          return s.length < 2 ? '0' + s : s;
        }).join('');
      }
      function mixHex(a, b, t) {
        var A = hexToRgb(a), B = hexToRgb(b);
        return rgbToHex([
          A[0] + (B[0] - A[0]) * t,
          A[1] + (B[1] - A[1]) * t,
          A[2] + (B[2] - A[2]) * t
        ]);
      }
      function shade(hex, k) {
        var c = hexToRgb(hex);
        return rgbToHex([c[0] * k, c[1] * k, c[2] * k]);
      }
      function desat(hex, t, grey) {
        var c = hexToRgb(hex);
        var g = typeof grey === 'number' ? grey : (c[0] + c[1] + c[2]) / 3;
        return rgbToHex([c[0] + (g - c[0]) * t, c[1] + (g - c[1]) * t, c[2] + (g - c[2]) * t]);
      }
      function hexA(hex, a) {
        var c = hexToRgb(hex);
        return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + clamp(a, 0, 1).toFixed(3) + ')';
      }

      var lit = 0;

      function buildSky() {
        var h = envState.hour, i = 0;
        while (i < SKY_KEYS.length - 2 && SKY_KEYS[i + 1][0] <= h) i++;
        var a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
        var t = clamp((h - a[0]) / (b[0] - a[0] || 1), 0, 1);
        t = t * t * (3 - 2 * t);

        var top = mixHex(a[1], b[1], t);
        var mid = mixHex(a[2], b[2], t);
        var hor = mixHex(a[3], b[3], t);

        var c = envState.cloud;
        top = shade(desat(top, c * 0.5), 1 - c * 0.18);
        mid = shade(desat(mid, c * 0.5), 1 - c * 0.14);
        hor = shade(desat(hor, c * 0.42), 1 - c * 0.08);
        if (envState.cond === 'fog') hor = desat(hor, 0.5, 120);
        if (envState.cond === 'thunder') { top = shade(top, 0.68); mid = shade(mid, 0.74); }

        sky.top = top; sky.mid = mid; sky.horizon = hor;
        lit = clamp(1 - envState.light * 1.75, 0, 1);
        lit = Math.pow(lit, 0.85);
        wetness = envState.cond === 'rain' || envState.cond === 'thunder' ? 1
          : (envState.cond === 'drizzle' ? 0.6 : (envState.cond === 'snow' ? 0.35 : 0.14));
        neonPower = clamp(0.25 + lit * 0.95, 0, 1.25);
      }

      var wetness = 1;
      var neonPower = 1;

      /* =====================================================================
       * 3. 城市
       * ===================================================================== */
      var city = [];
      var signs = [];
      var puddles = [];
      var lamps = [];
      var stars = [];
      var rainDrops = [];
      var rainScale = 1;
      var flash = 0;
      var bolts = [];
      var buildingHits = [];
      var skid = [];
      var lastSkid = 0;
      var shocks = [];
      var splashes = [];
      var pulses = [];
      var clouds = [];
      var cars = [];
      var moon = { x: 0.76, y: 0.18 };

      var NEON = ['#ff4f9a', '#4fd6ff', '#ffd08a', '#a06bff', '#5cffc4'];
      var WARM = ['#ffd8a2', '#ffe6bf', '#ffc884'];
      var COOL = ['#9fd8ff', '#b6f0ff', '#8fb4ff'];

      var LAYERS = [
        { base: 0.712, hMin: 0.085, hMax: 0.275, depth: 0.16, body: '#4a5988', bodyA: 0.16, winP: 0.16, fog: 0.62 },
        { base: 0.724, hMin: 0.125, hMax: 0.365, depth: 0.34, body: '#33406b', bodyA: 0.30, winP: 0.18, fog: 0.42 },
        { base: 0.740, hMin: 0.130, hMax: 0.345, depth: 0.55, body: '#121a2e', bodyA: 0.66, winP: 0.21, fog: 0.24 },
        { base: 0.756, hMin: 0.150, hMax: 0.420, depth: 0.78, body: '#0a1020', bodyA: 0.86, winP: 0.23, fog: 0.10 },
        { base: 0.768, hMin: 0.170, hMax: 0.480, depth: 0.92, body: '#05070e', bodyA: 1.00, winP: 0.19, fog: 0.05 }
      ];

      function buildCity() {
        city = [];
        signs = [];
        puddles = [];
        lamps = [];
        stars = [];
        clouds = [];
        splashes = [];
        rainDrops = [];
        cars = [];

        var seed = 20261128;

        for (var li = 0; li < LAYERS.length; li++) {
          var cfg = LAYERS[li];
          var rnd = mulberry(seed + li * 977);
          var band = { cfg: cfg, buildings: [] };
          var x = -0.03;

          while (x < 1.05) {
            var w = li < 2 ? (0.010 + rnd() * 0.040) : (0.016 + rnd() * 0.115);
            if (rnd() < 0.18) w *= 1.7;
            w = Math.min(w, 0.16);
            var hh = cfg.hMin + rnd() * (cfg.hMax - cfg.hMin);
            if (rnd() < 0.15) hh *= 1.25 + rnd() * 0.55;
            var baseY = cfg.base + (rnd() - 0.5) * 0.010;
            // 超高塔楼轻微压缩，顶部留出天空，且不会出现一排在同一条线上的"平头"
            if (hh > 0.62) hh = 0.62 + (hh - 0.62) * 0.12;
            var top = baseY - hh;
            var b = {
              x: x, w: w, top: top, h: hh, base: baseY,
              body: shade(cfg.body, 0.85 + rnd() * 0.45),
              windows: [],
              roof: rnd(),
              antenna: rnd() < 0.4,
              edge: rnd() < 0.45 ? NEON[Math.floor(rnd() * NEON.length)] : null,
              neon: null,
              floors: rnd() < 0.3
            };

            var bwPx = w * W, bhPx = hh * H;
            var cols = clamp(Math.round(bwPx / 24), 2, 16);
            var rows = clamp(Math.round(bhPx / 26), 4, 28);
            var cellW = w / cols, cellHPx = bhPx / rows;
            // 窗格按像素定尺寸：限制宽高比，矮楼上不会再出现扁平横条；每栋楼再带一点尺寸差异
            // 尺寸扰动取自已有的 roof 随机值，避免额外消耗随机数打乱整体楼群布局
            var wScale = 0.88 + ((b.roof * 7.31) % 1) * 0.34;
            var wwPx = clamp(bwPx / cols * 0.44 * wScale, 2.5, 8);
            var whPx = clamp(cellHPx * 0.52 * wScale, 3, 9);
            if (wwPx > whPx * 1.15) wwPx = whPx * 1.15;
            var ww = wwPx / bwPx, wh = whPx / bhPx;
            // 顶部留白与行距都按楼高像素换算，保证窗户铺满整栋楼而不是挤在顶部
            var padTop = Math.min(0.010 * H, bhPx * 0.05);
            for (var r = 1; r < rows; r++) {
              for (var cc = 0; cc < cols; cc++) {
                if (rnd() > cfg.winP * (b.floors ? 1.9 : 1)) continue;
                var pick = rnd();
                b.windows.push({
                  x: (cellW * (cc + 0.5) - (wwPx / 2) / W) / w,
                  y: (padTop + cellHPx * (r + 0.5) - whPx / 2) / bhPx,
                  w: ww,
                  h: wh,
                  on: rnd(),
                  fl: rnd(),
                  ph: rnd() * 6.283,
                  col: pick < 0.62 ? WARM[(pick * 10) % 3 | 0] : (pick < 0.85 ? COOL[(pick * 10) % 3 | 0] : NEON[(pick * 7) % 5 | 0])
                });
              }
            }

            // 霓虹招牌（远层不挂招牌，只留楼体灯光）
            if (li >= 2 && rnd() < (li >= 3 ? 0.5 : 0.22)) {
              var kind = rnd();
              var neon = {
                type: kind < 0.42 ? 'v' : (kind < 0.82 ? 'h' : 'billboard'),
                color: NEON[Math.floor(rnd() * NEON.length)],
                x: 0.1 + rnd() * 0.7,
                y: 0.05 + rnd() * 0.42,
                len: 0.08 + rnd() * 0.2,
                thick: 0.004 + rnd() * 0.006,
                ph: rnd() * 6.283,
                boost: 0,
                depth: cfg.depth
              };
              if (neon.type === 'billboard') {
                neon.w = 0.10 + rnd() * 0.16;
                neon.h = 0.045 + rnd() * 0.075;
              }
              b.neon = neon;
              neon.absX = x + w * neon.x;
              signs.push(neon);
            }

            band.buildings.push(b);
            // 楼体交错：允许负间距，让相邻楼轻微叠压
            x += w + (rnd() < 0.45 ? -0.006 - rnd() * 0.018 : 0.001 + rnd() * 0.016);
          }
          city.push(band);
        }

        var rnd2 = mulberry(seed + 77);
        for (var l = 0; l < 7; l++) {
          lamps.push({ x: 0.05 + l * 0.145 + rnd2() * 0.05, h: 0.05 + rnd2() * 0.025, ph: rnd2() * 6.283 });
        }

        for (var p = 0; p < 18; p++) {
          puddles.push({
            x: rnd2(), y: STREET + 0.006 + rnd2() * 0.19,
            rx: 0.025 + rnd2() * 0.085, ry: 0.004 + rnd2() * 0.014,
            ph: rnd2() * 6.283,
            col: NEON[Math.floor(rnd2() * NEON.length)]
          });
        }

        for (var s = 0; s < 170; s++) {
          stars.push({
            x: rnd2(), y: rnd2() * 0.46,
            r: 0.5 + rnd2() * 1.2,
            b: 0.2 + rnd2() * 0.7,
            tw: 0.4 + rnd2() * 1.6,
            ph: rnd2() * 6.283
          });
        }

        var n = clamp(Math.round(W * H / 9000), 160, 560);
        for (var q = 0; q < n; q++) {
          rainDrops.push({
            x: Math.random(), y: Math.random(),
            v: 0.7 + Math.random() * 0.9,
            l: 0.010 + Math.random() * 0.030,
            a: 0.08 + Math.random() * 0.28,
            d: 0.25 + Math.random() * 0.75
          });
        }

        for (var c2 = 0; c2 < 12; c2++) {
          clouds.push({
            x: rnd2(), y: 0.02 + rnd2() * 0.32,
            s: 0.4 + rnd2() * 1.0,
            v: 0.002 + rnd2() * 0.006,
            a: 0.05 + rnd2() * 0.13
          });
        }

        // 低空飞行车：成对光点，沿地平线上方横穿
        for (var cc = 0; cc < 4; cc++) {
          cars.push({
            x: rnd2(), y: 0.16 + rnd2() * 0.24,
            sp: (0.012 + rnd2() * 0.030) * (rnd2() < 0.5 ? 1 : -1),
            d: 0.4 + rnd2() * 0.6,
            col: rnd2() < 0.5 ? '#4fd6ff' : '#ff6fae',
            ph: rnd2() * 6.283
          });
        }
      }

      /* =====================================================================
       * 4. 尺寸
       * ===================================================================== */
      var resizeTimer = 0;
      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(window.innerWidth * DPR));
        canvas.height = Math.max(1, Math.round(window.innerHeight * DPR));
        W = canvas.width; H = canvas.height;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        buildCity();
      }

      /* =====================================================================
       * 5. 绘制
       * ===================================================================== */
      function drawSky() {
        var g = ctx.createLinearGradient(0, 0, 0, H * STREET);
        g.addColorStop(0, sky.top);
        g.addColorStop(0.55, sky.mid);
        g.addColorStop(1, sky.horizon);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        if (lit > 0.05) {
          var cg = ctx.createRadialGradient(W * 0.5, H * STREET, 0, W * 0.5, H * STREET, Math.max(W, H) * 0.65);
          cg.addColorStop(0, 'rgba(126,42,96,' + (0.34 * lit).toFixed(3) + ')');
          cg.addColorStop(0.45, 'rgba(74,28,74,' + (0.14 * lit).toFixed(3) + ')');
          cg.addColorStop(1, 'rgba(40,16,50,0)');
          ctx.fillStyle = cg;
          ctx.fillRect(0, 0, W, H);
        }
      }

      function drawMoon() {
        var vis = clamp(1 - envState.cloud * 1.25, 0, 1);
        if (vis < 0.04) return;
        var x = moon.x * W + par.x * 6;
        var y = moon.y * H + par.y * 4;
        var r = Math.min(W, H) * 0.026;
        var g = ctx.createRadialGradient(x, y, 0, x, y, r * 7);
        g.addColorStop(0, 'rgba(206,224,255,' + (0.30 * vis).toFixed(3) + ')');
        g.addColorStop(0.35, 'rgba(170,196,240,' + (0.10 * vis).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(140,170,220,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r * 7, 0, 6.283);
        ctx.fill();

        ctx.globalAlpha = 0.55 * vis;
        ctx.fillStyle = '#e8f0ff';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 6.283);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function drawStars() {
        var vis = clamp(1 - envState.light * 2.4, 0, 1) * (1 - envState.cloud * 0.92);
        if (vis < 0.02) return;
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var tw = 0.55 + 0.45 * Math.sin(elapsed * 0.001 * s.tw + s.ph);
          var a = s.b * tw * vis * 0.9;
          if (a < 0.02) continue;
          ctx.fillStyle = 'rgba(226,236,255,' + a.toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(s.x * W + par.x * 5, s.y * H + par.y * 3, s.r * DPR, 0, 6.283);
          ctx.fill();
        }
      }

      function drawClouds() {
        var alpha = clamp(0.25 + envState.cloud * 1.0, 0.1, 1.15);
        var dts = dt / 1000;
        for (var i = 0; i < clouds.length; i++) {
          var c = clouds[i];
          c.x += c.v * dts * 0.5;
          if (c.x > 1.3) c.x = -0.3;
          var x = c.x * W + par.x * 20;
          var y = c.y * H;
          var rx = c.s * W * 0.38;
          var ry = c.s * H * 0.06;
          var a = c.a * alpha;
          if (a < 0.004) continue;
          var g = ctx.createRadialGradient(x, y, 0, x, y, rx);
          g.addColorStop(0, 'rgba(150,120,160,' + a.toFixed(3) + ')');
          g.addColorStop(1, 'rgba(150,120,160,0)');
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(1, ry / rx);
          ctx.translate(-x, -y);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, rx, 0, 6.283);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawCars() {
        var dts = dt / 1000;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (var i = 0; i < cars.length; i++) {
          var c = cars[i];
          c.x += c.sp * dts;
          if (c.x > 1.3) c.x = -0.3;
          if (c.x < -0.3) c.x = 1.3;
          var x = c.x * W + par.x * 26 * c.d;
          var y = c.y * H + par.y * 10 * c.d;
          var tw = 0.6 + 0.4 * Math.sin(elapsed * 0.004 + c.ph);
          var len = W * 0.045 * c.d;
          var dir = c.sp > 0 ? -1 : 1;
          var g = ctx.createLinearGradient(x, y, x + len * dir, y);
          g.addColorStop(0, hexA(c.col, 0.55 * tw));
          g.addColorStop(1, hexA(c.col, 0));
          ctx.fillStyle = g;
          ctx.fillRect(x + Math.min(0, len * dir), y, Math.abs(len), Math.max(1, 1.4 * DPR));
          ctx.fillStyle = hexA(c.col, 0.85 * tw);
          ctx.beginPath();
          ctx.arc(x, y, 1.4 * DPR, 0, 6.283);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawSkyline() {
        buildingHits = [];

        // 楼群背后的低空雾霭，避免层间露出天空
        var hg = ctx.createLinearGradient(0, 0.66 * H, 0, STREET * H);
        hg.addColorStop(0, 'rgba(22,12,38,0)');
        hg.addColorStop(0.55, 'rgba(14,8,26,0.55)');
        hg.addColorStop(1, 'rgba(6,3,12,0.92)');
        ctx.fillStyle = hg;
        ctx.fillRect(0, 0.66 * H, W, (STREET - 0.66) * H);
        for (var li = 0; li < city.length; li++) {
          var band = city[li];
          var cfg = band.cfg;
          var shift = par.x * 34 * cfg.depth;
          var lift = par.y * 12 * cfg.depth;
          var hazeT = clamp(cfg.fog + (1 - envState.light) * 0.10, 0, 0.85);
          if (envState.cond === 'fog') hazeT = clamp(hazeT + 0.22, 0, 0.9);
          var dayBody = shade(desat(sky.horizon, 0.4), 0.68);
          // 越远的楼窗光越淡，近景留到最后
          var layerDim = [0.38, 0.54, 0.72, 0.88, 1.00][li] || 0.38;
          var winPower = Math.pow(lit, 1.2);

          for (var bi = 0; bi < band.buildings.length; bi++) {
            var b = band.buildings[bi];
            var bx = b.x * W + shift;
            var bw = b.w * W;
            var by = b.top * H + lift;
            var bh = ((b.base || cfg.base) - b.top) * H;
            // 楼体向下延伸到街面以下，层层覆盖，避免与地面脱节
            var bhDraw = Math.max(bh, (STREET - b.top) * H + 2);

            // 指针凑近才亮灯：距离越近越亮，并用缓动避免明暗闪跳
            var hoverTarget = 0;
            if (pointer.inside) {
              var pcx = pointer.x * W, pcy = pointer.y * H;
              var hdx = Math.max(bx - pcx, 0, pcx - (bx + bw));
              var hdy = Math.max(by - pcy, 0, pcy - (by + bh));
              var hdist = Math.sqrt(hdx * hdx + hdy * hdy);
              hoverTarget = clamp(1 - hdist / (H * 0.24), 0, 1);
              hoverTarget *= hoverTarget;
            }
            if (b.hoverEase == null) b.hoverEase = hoverTarget;
            b.hoverEase += (hoverTarget - b.hoverEase) * (reduceMotion ? 1 : 0.16);
            b.hover = b.hoverEase;

            var bodyCol = mixHex(b.body, sky.horizon, hazeT * 0.55);
            var dayLift = clamp(1 - lit, 0, 1) * (1 - envState.cloud * 0.35) * 0.5;
            if (dayLift > 0.01) bodyCol = mixHex(bodyCol, dayBody, dayLift);

            // 楼体：上深下浅的竖直渐变，避免变成纯色板
            var bg = ctx.createLinearGradient(bx, by, bx, by + bhDraw);
            bg.addColorStop(0, mixHex(bodyCol, '#000000', 0.18));
            bg.addColorStop(0.6, bodyCol);
            bg.addColorStop(1, mixHex(bodyCol, sky.horizon, 0.22));
            ctx.save();
            ctx.globalAlpha = cfg.bodyA == null ? 1 : cfg.bodyA;
            ctx.fillStyle = bg;
            ctx.fillRect(bx, by, bw, bhDraw);
            ctx.restore();

            // 屋顶杂物：水箱、机房，打破整齐的天际线
            if (li >= 2) {
              ctx.fillStyle = mixHex(bodyCol, '#000000', 0.30);
              var rn = b.roof > 0.55 ? 2 : 1;
              for (var rk = 0; rk < rn; rk++) {
                var rw = bw * (0.10 + ((b.roof * 7 + rk * 0.37) % 1) * 0.16);
                var rh = H * (0.008 + ((b.roof * 3 + rk * 0.53) % 1) * 0.014);
                var rx = bx + bw * ((b.roof * 5 + rk * 0.41) % 1) * (1 - rw / bw);
                ctx.fillRect(rx, by - rh, rw, rh);
              }
              ctx.fillStyle = 'rgba(130,160,200,0.10)';
              ctx.fillRect(bx, by, bw, Math.max(1, DPR * 0.8));
            }

            // 侧边霓虹描边
            if (b.edge && neonPower > 0.1) {
              ctx.save();
              ctx.globalCompositeOperation = 'lighter';
              var ea = 0.16 * neonPower * (0.75 + 0.25 * Math.sin(elapsed * 0.0013 + b.roof * 6));
              var eg = ctx.createLinearGradient(bx, by, bx, by + bh * 0.8);
              eg.addColorStop(0, hexA(b.edge, ea));
              eg.addColorStop(1, hexA(b.edge, 0));
              ctx.fillStyle = eg;
              ctx.fillRect(bx, by, Math.max(1, 1.5 * DPR), bh * 0.8);
              ctx.restore();
            }

            // 窗
            if (winPower > 0.02) {
              var budget = reduceMotion ? Math.ceil(b.windows.length * 0.6) : b.windows.length;
              var glowR = Math.max(1.5, 2.2 * DPR);
              for (var wi = 0; wi < budget; wi++) {
                var win = b.windows[wi];
                if (win.on > winPower * 1.02 + 0.03) continue;
                var flick = reduceMotion ? 1 : (0.82 + 0.18 * Math.sin(elapsed * 0.0012 + win.ph));
                // 平时维持低亮度，指针靠近时成倍点亮
                var baseA = (0.30 + win.fl * 0.50) * winPower * flick * layerDim;
                var a = clamp(baseA * (0.45 + b.hover * 3.0), 0, 0.95);
                var wx = bx + win.x * bw, wy = by + win.y * bh;
                var wwv = Math.max(1, win.w * bw), whv = Math.max(1, win.h * bh);
                // 被指针点亮时带一圈柔光，像真的开了灯
                if (b.hover > 0.10) {
                  ctx.save();
                  ctx.globalCompositeOperation = 'lighter';
                  ctx.fillStyle = hexA(win.col, a * 0.32 * b.hover);
                  ctx.fillRect(wx - glowR, wy - glowR, wwv + glowR * 2, whv + glowR * 2);
                  ctx.restore();
                }
                ctx.fillStyle = hexA(win.col, a);
                ctx.fillRect(wx, wy, wwv, whv);
              }
            }

            // 雪顶
            if (envState.cond === 'snow') {
              ctx.fillStyle = 'rgba(226,240,250,0.6)';
              ctx.fillRect(bx, by, bw, Math.max(1, 1.4 * DPR));
            }

            // 屋顶细节
            if (b.roof > 0.72) {
              ctx.fillStyle = shade(bodyCol, 0.78);
              ctx.fillRect(bx + bw * 0.4, by - bh * 0.05, Math.max(1, bw * 0.07), bh * 0.05);
            }
            if (b.antenna) {
              var ax = bx + bw * 0.72;
              var ah = bh * 0.10;
              ctx.strokeStyle = shade(bodyCol, 0.7);
              ctx.lineWidth = Math.max(1, 1 * DPR);
              ctx.beginPath();
              ctx.moveTo(ax, by);
              ctx.lineTo(ax, by - ah);
              ctx.stroke();
              var blink = 0.5 + 0.5 * Math.sin(elapsed * 0.0022 + b.roof * 9);
              if (blink > 0.45 && lit > 0.2) {
                ctx.fillStyle = 'rgba(255,84,96,' + (blink * 0.9).toFixed(3) + ')';
                ctx.beginPath();
                ctx.arc(ax, by - ah, 1.6 * DPR, 0, 6.283);
                ctx.fill();
              }
            }

            // 霓虹招牌
            if (b.neon) b.neon.hover = b.hover;
            if (b.neon && neonPower > 0.05) drawSign(b.neon, bx, by, bw, bh);

            buildingHits.push({ x: bx, y: by, w: bw, h: bh, b: b });
          }
        }
      }

      function drawSign(sgn, bx, by, bw, bh) {
        var sx = bx + sgn.x * bw;
        var sy = by + sgn.y * bh;
        var pulseK = 1 + (sgn.boost || 0) * 1.8 + (sgn.hover || 0) * 0.8;
        var neb = clamp(neonPower * pulseK, 0, 1.6) * (sgn.dark ? 0.14 : 1);
        if (neb <= 0.04) return;
        var flick = reduceMotion ? 1 : (0.86 + 0.14 * Math.sin(elapsed * 0.004 + sgn.ph));
        var alpha = clamp(0.5 * neb * flick, 0, 0.95);
        var thick = Math.max(1.5, sgn.thick * Math.min(W, H));

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        if (sgn.type === 'billboard') {
          // 招牌尺寸以所在楼体为上限，避免高楼上挂出横跨半屏的巨幅灯箱
          var bwPx = Math.min(sgn.w * W, bw * 0.92);
          var bhPx = Math.min(sgn.h * H, bh * 0.30);
          sx = clamp(sx, bx + 1, bx + bw - bwPx - 1);
          sy = clamp(sy, by + 1, by + bh - bhPx - 1);
          // 背光板
          var bg = ctx.createLinearGradient(sx, sy, sx, sy + bhPx);
          bg.addColorStop(0, hexA(sgn.color, alpha * 0.55));
          bg.addColorStop(1, hexA(sgn.color, alpha * 0.14));
          ctx.fillStyle = bg;
          ctx.fillRect(sx, sy, bwPx, bhPx);
          // 外发光
          ctx.strokeStyle = hexA(sgn.color, alpha * 0.9);
          ctx.lineWidth = Math.max(1, 1.2 * DPR);
          ctx.strokeRect(sx, sy, bwPx, bhPx);
          // 内部图形：竖条 + 横线，像抽象字牌
          var bars = Math.max(3, Math.round(bwPx / (10 * DPR)));
          for (var k = 0; k < bars; k++) {
            var on = Math.sin(k * 1.7 + sgn.ph + elapsed * 0.0018) > -0.2;
            if (!on) continue;
            var bxk = sx + (bwPx / bars) * (k + 0.22);
            var hgt = bhPx * (0.35 + 0.4 * (0.5 + 0.5 * Math.sin(k * 2.1 + sgn.ph)));
            ctx.fillStyle = 'rgba(255,255,255,' + (alpha * 0.35).toFixed(3) + ')';
            ctx.fillRect(bxk, sy + bhPx * 0.18, Math.max(1, bwPx / bars * 0.5), hgt);
          }
        } else if (sgn.type === 'v') {
          var len = sgn.len * H;
          var vg = ctx.createLinearGradient(sx, sy, sx, sy + len);
          vg.addColorStop(0, hexA(sgn.color, 0));
          vg.addColorStop(0.18, hexA(sgn.color, alpha * 0.85));
          vg.addColorStop(0.82, hexA(sgn.color, alpha));
          vg.addColorStop(1, hexA(sgn.color, 0));
          ctx.fillStyle = vg;
          ctx.fillRect(sx - thick * 2.6, sy, thick * 5.2, len);
          ctx.fillStyle = hexA(sgn.color, alpha);
          ctx.fillRect(sx - thick * 0.45, sy + len * 0.13, thick * 0.9, len * 0.74);
        } else {
          var len2 = sgn.len * W * 0.42;
          var hg = ctx.createLinearGradient(sx, sy, sx + len2, sy);
          hg.addColorStop(0, hexA(sgn.color, 0));
          hg.addColorStop(0.18, hexA(sgn.color, alpha * 0.85));
          hg.addColorStop(0.82, hexA(sgn.color, alpha));
          hg.addColorStop(1, hexA(sgn.color, 0));
          ctx.fillStyle = hg;
          ctx.fillRect(sx, sy - thick * 2.6, len2, thick * 5.2);
          ctx.fillStyle = hexA(sgn.color, alpha);
          ctx.fillRect(sx + len2 * 0.12, sy - thick * 0.45, len2 * 0.76, thick * 0.9);
        }
        ctx.restore();
      }

      function drawStreet() {
        var y0 = H * STREET;
        var dayLift = clamp(1 - lit, 0, 1) * (1 - envState.cloud * 0.35);
        var g = ctx.createLinearGradient(0, y0, 0, H);
        g.addColorStop(0, mixHex(shade(sky.horizon, 0.9), '#5f616c', dayLift * 0.55));
        g.addColorStop(0.5, mixHex('#080a11', '#3c3e48', dayLift * 0.45));
        g.addColorStop(1, mixHex('#04050a', '#26282f', dayLift * 0.40));
        ctx.fillStyle = g;
        ctx.fillRect(0, y0, W, H - y0);

        // 楼体在水面的竖向反光
        if (wetness > 0.15 && neonPower > 0.05) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (var li = 0; li < city.length; li++) {
            var band = city[li];
            var shift = par.x * 34 * band.cfg.depth;
            for (var bi = 0; bi < band.buildings.length; bi++) {
              var b = band.buildings[bi];
              var bx = b.x * W + shift;
              var bw = b.w * W;
              var col = b.neon ? b.neon.color : (b.edge || '#ffcf9a');
              var a = (b.neon ? 0.17 : 0.07) * neonPower * wetness * (1 - band.cfg.depth * 0.45);
              if (a < 0.012) continue;
              var cx = bx + bw * 0.5;
              var rx = bw * 0.5;
              var ry = H * 0.058;
              var rg = ctx.createRadialGradient(cx, y0, 0, cx, y0, rx);
              rg.addColorStop(0, hexA(col, a));
              rg.addColorStop(0.5, hexA(col, a * 0.34));
              rg.addColorStop(1, hexA(col, 0));
              ctx.save();
              ctx.translate(cx, y0 + ry * 0.32);
              ctx.scale(1, ry / rx);
              ctx.translate(-cx, -y0);
              ctx.fillStyle = rg;
              ctx.beginPath();
              ctx.arc(cx, y0, rx, 0, 6.283);
              ctx.fill();
              ctx.restore();
            }
          }
          ctx.restore();
        }

        // 湿沥青薄光（顶边淡入，避免与楼脚形成硬边）
        var sheen = ctx.createLinearGradient(0, y0, 0, y0 + H * 0.10);
        sheen.addColorStop(0, 'rgba(196,206,232,0)');
        sheen.addColorStop(0.14, 'rgba(196,206,232,' + (0.020 + wetness * 0.050).toFixed(3) + ')');
        sheen.addColorStop(1, 'rgba(196,206,232,0)');
        ctx.fillStyle = sheen;
        ctx.fillRect(0, y0, W, H * 0.10);

        // 车灯在湿路面拖出的长条反光（随视角缓慢移动）
        if (neonPower > 0.1) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (var cI = 0; cI < 3; cI++) {
            var t = elapsed * 0.00016 + cI * 0.37;
            var cx2 = ((t % 1) * 1.4 - 0.2) * W;
            var yy = y0 + H * (0.06 + cI * 0.045);
            var wd = W * 0.10 * wetness;
            var cg = ctx.createLinearGradient(cx2 - wd, 0, cx2 + wd, 0);
            cg.addColorStop(0, 'rgba(255,196,150,0)');
            cg.addColorStop(0.5, 'rgba(255,206,160,' + (0.10 * neonPower * wetness).toFixed(3) + ')');
            cg.addColorStop(1, 'rgba(255,196,150,0)');
            ctx.fillStyle = cg;
            ctx.fillRect(cx2 - wd, yy, wd * 2, Math.max(1, 1.6 * DPR));
          }
          ctx.restore();
        }

        // 楼脚灯光洒在人行道上：让楼群与街道自然衔接
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (var li2 = 2; li2 < city.length; li2++) {
          var band2 = city[li2];
          var shift2 = par.x * 34 * band2.cfg.depth;
          for (var bi2 = 0; bi2 < band2.buildings.length; bi2++) {
            var bb = band2.buildings[bi2];
            var bxx = bb.x * W + shift2;
            var bww = bb.w * W;
            var spillCol = bb.neon ? bb.neon.color : (bb.edge || '#ffcf9a');
            var spA = (bb.neon ? 0.10 : 0.06) * neonPower * (0.6 + 0.4 * Math.sin(elapsed * 0.0011 + bb.roof * 7));
            if (spA < 0.008) continue;
            var sxc = bxx + bww * 0.5;
            var srx = bww * 0.85;
            var sry = H * 0.045;
            ctx.save();
            ctx.translate(sxc, y0 + H * 0.006);
            ctx.scale(1, sry / srx);
            var sg2 = ctx.createRadialGradient(0, 0, 0, 0, 0, srx);
            sg2.addColorStop(0, hexA(spillCol, spA));
            sg2.addColorStop(0.6, hexA(spillCol, spA * 0.35));
            sg2.addColorStop(1, hexA(spillCol, 0));
            ctx.fillStyle = sg2;
            ctx.beginPath();
            ctx.arc(0, 0, srx, 0, 6.283);
            ctx.fill();
            ctx.restore();
          }
        }
        ctx.restore();

        // 霓虹招牌在湿路面上拖出的长光柱
        if (wetness > 0.2 && neonPower > 0.08) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (var si = 0; si < signs.length; si++) {
            var sg = signs[si];
            if (sg.depth < 0.4) continue;
            var sxr = (sg.absX === undefined ? 0.5 : sg.absX) * W + par.x * 30;
            var sway = Math.sin(elapsed * 0.0011 + sg.ph) * W * 0.004;
            var top = y0 + 2;
            var hgt = H * 0.17;
            var wdt2 = Math.max(2, W * 0.004 * (0.6 + sg.thick * 70));
            var lg2 = ctx.createLinearGradient(0, top, 0, top + hgt);
            lg2.addColorStop(0, hexA(sg.color, 0.18 * neonPower * wetness));
            lg2.addColorStop(0.35, hexA(sg.color, 0.06 * neonPower * wetness));
            lg2.addColorStop(1, hexA(sg.color, 0));
            ctx.fillStyle = lg2;
            ctx.fillRect(sxr + sway - wdt2 / 2, top, wdt2, hgt);
          }
          ctx.restore();
        }

        // 透视车道线 + 横向道牙，补足下方纵深
        ctx.save();
        ctx.strokeStyle = '#cfe0f0';
        ctx.lineWidth = Math.max(1, 1.1 * DPR);
        ctx.globalAlpha = 0.12;
        for (var lz = 0; lz < 5; lz++) {
          var lx0 = W * (0.5 + (lz - 2) * 0.022);
          var lx1 = W * (0.5 + (lz - 2) * 0.30);
          ctx.beginPath();
          ctx.moveTo(lx0, y0 + H * 0.028);
          ctx.lineTo(lx1, H + 2);
          ctx.stroke();
        }
        for (var rz = 0; rz < 4; rz++) {
          var zy = y0 + H * (0.07 + rz * 0.085);
          ctx.globalAlpha = 0.11 - rz * 0.019;
          var segs = 9;
          for (var sx2 = 0; sx2 < segs; sx2++) {
            ctx.beginPath();
            ctx.moveTo(W * (sx2 / segs + 0.014), zy);
            ctx.lineTo(W * ((sx2 + 0.52) / segs), zy);
            ctx.stroke();
          }
        }
        ctx.restore();

        // 水洼
        for (var p = 0; p < puddles.length; p++) {
          var pd = puddles[p];
          var px = pd.x * W + par.x * 14;
          var py = pd.y * H;
          var wob = 1 + Math.sin(elapsed * 0.0011 + pd.ph) * 0.06;
          var alpha = (0.08 + wetness * 0.30) * (0.4 + neonPower * 0.9);
          var pg = ctx.createRadialGradient(px, py, 0, px, py, pd.rx * W * wob);
          pg.addColorStop(0, hexA(pd.col, alpha * 0.8));
          pg.addColorStop(0.55, 'rgba(90,180,220,' + (alpha * 0.28).toFixed(3) + ')');
          pg.addColorStop(1, 'rgba(60,120,180,0)');
          ctx.save();
          ctx.translate(px, py);
          ctx.scale(1, (pd.ry * H) / (pd.rx * W * wob));
          ctx.translate(-px, -py);
          ctx.fillStyle = pg;
          ctx.beginPath();
          ctx.arc(px, py, pd.rx * W * wob, 0, 6.283);
          ctx.fill();
          ctx.restore();
        }

        // 路灯：光锥 + 灯杆 + 地面光斑
        for (var l = 0; l < lamps.length; l++) {
          var lp = lamps[l];
          var lx = lp.x * W + par.x * 30;
          var ly = y0 - lp.h * H;
          lp.flare = Math.max(0, (lp.flare || 0) - dt * 0.0018);
          var la = (0.06 + neonPower * 0.55) * (1 + lp.flare * 1.6);
          var rr = Math.min(W, H) * 0.11;

          var cone = ctx.createLinearGradient(lx, ly, lx, y0 + H * 0.05);
          cone.addColorStop(0, 'rgba(255,214,160,' + (la * 0.22).toFixed(3) + ')');
          cone.addColorStop(1, 'rgba(255,190,130,0)');
          ctx.fillStyle = cone;
          ctx.beginPath();
          ctx.moveTo(lx - rr * 0.10, ly);
          ctx.lineTo(lx + rr * 0.10, ly);
          ctx.lineTo(lx + rr * 0.62, y0 + H * 0.045);
          ctx.lineTo(lx - rr * 0.62, y0 + H * 0.045);
          ctx.closePath();
          ctx.fill();

          var lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, rr);
          lg.addColorStop(0, 'rgba(255,222,176,' + (la * 0.85).toFixed(3) + ')');
          lg.addColorStop(0.4, 'rgba(255,198,140,' + (la * 0.26).toFixed(3) + ')');
          lg.addColorStop(1, 'rgba(255,170,120,0)');
          ctx.fillStyle = lg;
          ctx.beginPath();
          ctx.arc(lx, ly, rr, 0, 6.283);
          ctx.fill();

          ctx.strokeStyle = 'rgba(16,18,26,0.9)';
          ctx.lineWidth = Math.max(1, 1.6 * DPR);
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.lineTo(lx, y0 + 2);
          ctx.stroke();
        }

        // 地面雨滴涟漪
        for (var s = splashes.length - 1; s >= 0; s--) {
          var sp = splashes[s];
          sp.t += dt;
          var k = sp.t / sp.life;
          if (k >= 1) { splashes.splice(s, 1); continue; }
          var rad = sp.r0 + (sp.rmax - sp.r0) * Math.sqrt(k);
          var a2 = (1 - k) * 0.5;
          ctx.save();
          ctx.translate(sp.x, sp.y);
          ctx.scale(1, 0.34);
          ctx.strokeStyle = 'rgba(190,226,246,' + a2.toFixed(3) + ')';
          ctx.lineWidth = Math.max(1, 1.1 * DPR);
          ctx.beginPath();
          ctx.arc(0, 0, rad, 0, 6.283);
          ctx.stroke();
          ctx.restore();
        }

        // 近景大涟漪：撑起下半屏，避免空荡
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (var fz = 0; fz < 5; fz++) {
          var phz = elapsed * 0.00032 + fz * 0.21;
          var kz = phz % 1;
          var cz = W * (0.13 + fz * 0.19) + Math.sin(phz * 6.283) * W * 0.022;
          var yz = y0 + H * (0.15 + fz * 0.048);
          var rz2 = W * 0.010 + kz * W * 0.052;
          ctx.strokeStyle = 'rgba(170,215,240,' + ((1 - kz) * 0.20).toFixed(3) + ')';
          ctx.lineWidth = Math.max(1, 1.4 * DPR);
          ctx.beginPath();
          ctx.ellipse(cz, yz, rz2, rz2 * 0.30, 0, 0, 6.283);
          ctx.stroke();
        }
        ctx.restore();

        // 底部压暗，收住画面
        var btm2 = ctx.createLinearGradient(0, H * 0.72, 0, H);
        btm2.addColorStop(0, 'rgba(3,5,10,0)');
        btm2.addColorStop(0.6, 'rgba(3,5,10,0.30)');
        btm2.addColorStop(1, 'rgba(3,5,10,0.72)');
        ctx.fillStyle = btm2;
        ctx.fillRect(0, H * 0.72, W, H * 0.28);
      }

      function drawRain() {
        var c = envState.cond;
        var snowy = c === 'snow';
        if (!(c === 'rain' || c === 'drizzle' || c === 'thunder' || snowy)) return;

        var dts = dt / 1000;
        var heavy = c === 'thunder' ? 1.5 : (c === 'drizzle' ? 0.5 : 1);
        var ang = clamp(envState.wind * 1.1, 0, 30) * (snowy ? 0.4 : 1);
        var rad = ang * Math.PI / 180;
        var dx = Math.sin(rad), dy = Math.cos(rad);
        var count = Math.round(rainDrops.length * clamp(heavy * rainScale, 0.2, 1));

        ctx.save();
        if (snowy) {
          for (var i = 0; i < count; i++) {
            var s = rainDrops[i];
            s.y += (0.05 + s.v * 0.06) * dts;
            s.x += (0.012 + ang * 0.001) * dts + Math.sin(elapsed * 0.0008 + i) * 0.012 * dts;
            if (s.y > 1.02) { s.y = -0.04; s.x = Math.random(); }
            if (s.x > 1.02) s.x -= 1.04;
            ctx.fillStyle = 'rgba(236,246,255,' + clamp(s.a * 1.8, 0, 0.8).toFixed(3) + ')';
            ctx.beginPath();
            ctx.arc(s.x * W + par.x * 16 * s.d, s.y * H + par.y * 10 * s.d, (1 + s.d * 1.5) * DPR, 0, 6.283);
            ctx.fill();
          }
        } else {
          ctx.lineCap = 'round';
          for (var j = 0; j < count; j++) {
            var d = rainDrops[j];
            d.y += (0.55 + d.v * 0.85) * dts;
            d.x += dx * (0.12 + d.v * 0.2) * dts;
            if (d.y > 1.03) { d.y = -0.04; d.x = Math.random(); }
            if (d.x > 1.04) d.x -= 1.08;
            var px = d.x * W + par.x * 18 * d.d;
            var py = d.y * H + par.y * 10 * d.d;
            var len = d.l * H * (0.6 + d.d);
            ctx.strokeStyle = 'rgba(190,214,236,' + clamp(d.a * heavy, 0, 0.55).toFixed(3) + ')';
            ctx.lineWidth = Math.max(1, 0.9 * DPR);
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px - dx * len, py - dy * len);
            ctx.stroke();
          }

          if (Math.random() < dt * 0.055 * heavy) {
            splashes.push({
              x: Math.random() * W,
              y: (STREET + 0.01 + Math.random() * (1 - STREET)) * H,
              r0: Math.min(W, H) * 0.003,
              rmax: Math.min(W, H) * (0.008 + Math.random() * 0.014),
              t: 0, life: 520 + Math.random() * 320
            });
            if (splashes.length > 46) splashes.shift();
          }
        }
        ctx.restore();
      }

      function drawHaze() {
        var hz = envState.cond === 'fog' ? 0.30 : (envState.cond === 'rain' || envState.cond === 'snow' ? 0.13 : 0.05);
        hz += clamp((envState.humidity - 60) / 320, 0, 0.10);
        if (hz < 0.01) return;
        var y0 = H * STREET;
        var g = ctx.createLinearGradient(0, y0 - H * 0.24, 0, y0 + H * 0.10);
        g.addColorStop(0, 'rgba(120,110,140,0)');
        g.addColorStop(0.55, 'rgba(150,140,170,' + (hz * 0.7).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(150,140,170,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, y0 - H * 0.24, W, H * 0.34);
      }

      function drawPulses() {
        for (var i = pulses.length - 1; i >= 0; i--) {
          var p = pulses[i];
          p.t += dt;
          var k = p.t / p.life;
          if (k >= 1) { pulses.splice(i, 1); continue; }
          var a = Math.pow(1 - k, 1.8);
          var yTop = H * 0.06;
          var yStreet = H * STREET;
          var col = p.color;

          ctx.save();
          ctx.globalCompositeOperation = 'lighter';

          var wdt = Math.max(4, W * 0.006 * (1 + k * 1.6));
          var cg = ctx.createLinearGradient(0, yTop, 0, yStreet);
          cg.addColorStop(0, hexA(col, 0));
          cg.addColorStop(0.45, hexA(col, a * 0.20));
          cg.addColorStop(1, hexA(col, a * 0.60));
          ctx.fillStyle = cg;
          ctx.fillRect(p.x - wdt / 2, yTop, wdt, yStreet - yTop);

          var rad = Math.min(W, H) * (0.05 + k * 0.30);
          var eg = ctx.createRadialGradient(p.x, yStreet, 0, p.x, yStreet, rad);
          eg.addColorStop(0, hexA(col, a * 0.55));
          eg.addColorStop(0.5, hexA(col, a * 0.18));
          eg.addColorStop(1, hexA(col, 0));
          ctx.save();
          ctx.translate(p.x, yStreet);
          ctx.scale(1, 0.28);
          ctx.translate(-p.x, -yStreet);
          ctx.fillStyle = eg;
          ctx.beginPath();
          ctx.arc(p.x, yStreet, rad, 0, 6.283);
          ctx.fill();
          ctx.restore();

          // 沿街面扩散的双环
          for (var ring = 0; ring < 2; ring++) {
            var rr = Math.min(W, H) * (0.04 + k * (0.26 + ring * 0.10));
            ctx.save();
            ctx.translate(p.x, yStreet);
            ctx.scale(1, 0.22);
            ctx.strokeStyle = hexA(col, a * (0.42 - ring * 0.16));
            ctx.lineWidth = Math.max(1, (2.4 - k * 1.6) * DPR);
            ctx.beginPath();
            ctx.arc(0, 0, rr, 0, 6.283);
            ctx.stroke();
            ctx.restore();
          }

          var bandY = yStreet - (yStreet - yTop) * k;
          ctx.fillStyle = hexA(col, a * 0.26);
          ctx.fillRect(p.x - W * 0.10, bandY, W * 0.20, Math.max(2, H * 0.010));
          ctx.restore();
        }
      }

      function drawVignette() {
        var k = 0.58 + (1 - envState.light) * 0.22;
        var g = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.30, W / 2, H * 0.55, Math.max(W, H) * 0.80);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.65, 'rgba(4,4,10,' + (k * 0.28).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(4,4,10,' + k.toFixed(3) + ')');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      /* =====================================================================
       * 6. 交互
       * ===================================================================== */
      var pointer = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, inside: false, down: false };
      var par = { x: 0, y: 0 };
      var lastInput = 0;

      function markInput() { lastInput = elapsed; }

      // 事件坐标换算成画布设备像素（高分屏下必须乘 DPR / 按 rect 比例）
      function toCanvas(e) {
        var rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) / Math.max(1, rect.width) * W,
          y: (e.clientY - rect.top) / Math.max(1, rect.height) * H
        };
      }

      function firePulse(cx, cy) {
        var nx = cx / W;
        var best = null, bestD = 1e9;
        for (var i = 0; i < signs.length; i++) {
          var s = signs[i];
          var sx = s.absX === undefined ? s.x : s.absX;
          var d = Math.abs(sx - nx);
          if (d < bestD) { bestD = d; best = s; }
        }
        var color = best ? best.color : '#ff4f9a';
        if (best) best.boost = 1;
        pulses.push({ x: cx, y: cy, t: 0, life: 1000, color: color });
        if (pulses.length > 5) pulses.shift();
      }

      function triggerLightning(nx) {
        flash = 1;
        var pts = [];
        var x = clamp(nx, 0.08, 0.92), y = 0;
        pts.push({ x: x, y: y });
        for (var i = 1; i <= 9; i++) {
          x += (Math.random() - 0.5) * 0.07;
          y = (i / 9) * (0.28 + Math.random() * 0.14);
          pts.push({ x: x, y: y });
        }
        bolts.push({ pts: pts, life: 1 });
        if (bolts.length > 3) bolts.shift();
      }

      function drawFlash() {
        if (flash > 0) {
          ctx.fillStyle = 'rgba(206,232,255,' + (flash * 0.26).toFixed(3) + ')';
          ctx.fillRect(0, 0, W, H);
          flash = Math.max(0, flash - dt * 0.0032);
        }
        for (var b = bolts.length - 1; b >= 0; b--) {
          var bolt = bolts[b];
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = 'rgba(190,225,255,' + (bolt.life * 0.85).toFixed(3) + ')';
          ctx.lineWidth = Math.max(1.2, 2.0 * DPR);
          ctx.beginPath();
          for (var i = 0; i < bolt.pts.length; i++) {
            var px = bolt.pts[i].x * W;
            var py = bolt.pts[i].y * H;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.strokeStyle = 'rgba(120,180,255,' + (bolt.life * 0.30).toFixed(3) + ')';
          ctx.lineWidth = Math.max(2.5, 5 * DPR);
          ctx.stroke();
          ctx.restore();
          bolt.life -= dt * 0.0016;
          if (bolt.life <= 0) bolts.splice(b, 1);
        }
      }

      function lampAt(cx, cy) {
        var y0s = STREET * H;
        for (var i = 0; i < lamps.length; i++) {
          var lp = lamps[i];
          var lx = lp.x * W + par.x * 30;
          var ly = y0s - lp.h * H;
          var d = Math.sqrt((cx - lx) * (cx - lx) + (cy - ly) * (cy - ly));
          if (d < Math.min(W, H) * 0.07) return lp;
        }
        return null;
      }

      function drawSkid() {
        if (!skid.length) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (var i = skid.length - 1; i >= 0; i--) {
          var s = skid[i];
          s.life -= dt * 0.0011;
          if (s.life <= 0) { skid.splice(i, 1); continue; }
          var rad = 56;
          var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rad);
          g.addColorStop(0, hexA(s.col, s.life * 0.30));
          g.addColorStop(1, hexA(s.col, 0));
          ctx.fillStyle = g;
          ctx.fillRect(s.x - rad, s.y - rad, rad * 2, rad * 2);
        }
        ctx.restore();
      }

      function triggerShock(cx, cy) {
        shocks.push({ x: cx, y: cy, t: 0, life: 1100 });
        if (shocks.length > 4) shocks.shift();
      }

      function drawShocks() {
        if (!shocks.length) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (var i = shocks.length - 1; i >= 0; i--) {
          var s = shocks[i];
          s.t += dt * 0.001;
          var p = s.t / (s.life / 1000);
          if (p >= 1) { shocks.splice(i, 1); continue; }
          var r = Math.min(W, H) * (0.02 + p * 0.34);
          var a = (1 - p) * 0.5;

          // 贴地透视：竖向压扁
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.scale(1, 0.42);
          ctx.strokeStyle = 'rgba(170,235,255,' + (a * 0.85).toFixed(3) + ')';
          ctx.lineWidth = Math.max(1, (2.2 - p * 1.6) * DPR);
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, 6.283);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255,120,200,' + (a * 0.35).toFixed(3) + ')';
          ctx.lineWidth = Math.max(1, 1.2 * DPR);
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.72, 0, 6.283);
          ctx.stroke();
          ctx.restore();

          // 中心冲击亮斑
          var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 0.5 + 2);
          g.addColorStop(0, 'rgba(210,246,255,' + (a * 0.5).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(120,200,255,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.ellipse(s.x, s.y, r * 0.6, r * 0.24, 0, 0, 6.283);
          ctx.fill();
        }
        ctx.restore();
      }

      function bindInput() {
        var downX = 0, downY = 0;

        window.addEventListener('pointermove', function (e) {
          pointer.tx = e.clientX / window.innerWidth;
          pointer.ty = e.clientY / window.innerHeight;
          pointer.inside = true;

          if (elapsed - lastSkid > 30) {
            var pm = toCanvas(e);
            if (pm.y > STREET * H) {
              lastSkid = elapsed;
              skid.push({
                x: pm.x, y: pm.y,
                life: 1,
                col: NEON[Math.floor(Math.random() * NEON.length)]
              });
              if (skid.length > 140) skid.shift();
            }
          }
          markInput();
        }, { passive: true });

        window.addEventListener('pointerdown', function (e) {
          pointer.down = true;
          var p = toCanvas(e);
          downX = p.x;
          downY = p.y;
          markInput();
        });

        window.addEventListener('pointerup', function (e) {
          var p = toCanvas(e);
          var moved = Math.abs(p.x - downX) + Math.abs(p.y - downY);
          if (pointer.down && moved < 16 * DPR) {
            var lp = lampAt(p.x, p.y);
            if (lp) {
              // 点路灯：灯头爆闪
              lp.flare = 1;
            } else {
              firePulse(p.x, p.y);
            }
          }
          pointer.down = false;
          markInput();
        });

        window.addEventListener('dblclick', function (e) {
          var p = toCanvas(e);
          var c = envState.cond;
          if (c === 'rain' || c === 'thunder' || c === 'drizzle') {
            // 雨天：双击打雷
            triggerLightning(p.x / W);
          } else {
            // 晴天/多云等：双击气浪
            triggerShock(p.x, p.y);
          }
          markInput();
        });

        window.addEventListener('pointerleave', function () {
          pointer.inside = false;
          pointer.down = false;
        });

        window.addEventListener('blur', function () {
          pointer.down = false;
          pointer.inside = false;
        });
      }

      function smoothPointer() {
        pointer.x += (pointer.tx - pointer.x) * 0.06;
        pointer.y += (pointer.ty - pointer.y) * 0.06;
        var tx = (pointer.x - 0.5) * 2;
        var ty = (pointer.y - 0.5) * 2;
        if (!pointer.inside) { tx *= 0.4; ty *= 0.4; }
        par.x += (tx - par.x) * 0.05;
        par.y += (ty - par.y) * 0.05;
      }

      /* =====================================================================
       * 7. 主循环
       * ===================================================================== */
      var acc = 0;

      function frame(ts) {
        requestAnimationFrame(frame);
        if (!lastTs) lastTs = ts;
        dt = Math.min(ts - lastTs, 66);
        lastTs = ts;
        elapsed += dt;

        if (!frame.envAt || elapsed - frame.envAt > 1000) {
          frame.envAt = elapsed;
          applyEnv();
        }

        for (var i = 0; i < signs.length; i++) {
          if (signs[i].boost > 0) signs[i].boost = Math.max(0, signs[i].boost - dt / 900);
        }

        var idle = elapsed - lastInput;
        var budget = reduceMotion ? 0.4 : (idle > 20000 ? 0.42 : (idle > 5000 ? 0.62 : 1));
        acc += dt * budget;
        if (acc < 16.6) return;
        acc = 0;

        smoothPointer();

        ctx.globalCompositeOperation = 'source-over';
        drawSky();
        drawStars();
        drawMoon();
        drawClouds();
        drawCars();
        drawSkyline();
        drawStreet();
        drawSkid();
        drawRain();
        drawHaze();
        drawPulses();
        drawShocks();
        drawVignette();
        drawFlash();
      }

      /* =====================================================================
       * 8. 时钟（左下角，交互唤醒浮现）
       * ===================================================================== */
      var clockWrap = document.getElementById('clockwrap');
      var clockMain = document.getElementById('clock-main');
      var clockSec = document.getElementById('clock-sec');
      var clockDate = document.getElementById('clock-date');
      var clockTimer = 0;
      var WEEK_CN = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }

      function tickClock() {
        var d = new Date();
        clockMain.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
        clockSec.textContent = pad2(d.getSeconds());
        clockDate.textContent = d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) + '　' + WEEK_CN[d.getDay()];
      }

      function wakeClock() {
        if (!clockWrap || !clockWrap.classList) return;
        clockWrap.classList.remove('hidden');
        clearTimeout(clockTimer);
        clockTimer = setTimeout(function () {
          clockWrap.classList.add('hidden');
        }, 6500);
      }

      tickClock();
      setInterval(tickClock, 1000);
      wakeClock();
      window.addEventListener('pointermove', wakeClock, { passive: true });
      window.addEventListener('pointerdown', wakeClock, { passive: true });
      window.addEventListener('keydown', wakeClock);

      /* =====================================================================
       * 9. 启动
       * ===================================================================== */
      function start() {
        resize();
        applyEnv();
        bindInput();
        lastTs = 0;

        var onResize = function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(resize, 160);
        };
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', onResize);
        window.addEventListener('contactable:env', applyEnv);

        requestAnimationFrame(frame);
      }

      start();
    })();
  </script>
</body>

</html>
