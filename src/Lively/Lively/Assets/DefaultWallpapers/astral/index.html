        }
      }

      /* ================= HUD ================= */

      var hudLocked = false;
      var hudTimer = 0;

      function wakeHud() {
        markBusy(600);
        if (hudLocked) return;
        hud.classList.remove('hidden');
        clearTimeout(hudTimer);
        hudTimer = setTimeout(function () {
          hud.classList.add('hidden');
        }, 6500);
      }

      function tickClock() {
        var d = new Date();
        clockEl.textContent = d.toLocaleTimeString('zh-CN', {
          hour12: false, hour: '2-digit', minute: '2-digit'
        });
        dateEl.textContent = d.toLocaleDateString('zh-CN', {
          year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
        });
      }

      function setMode(m) {
        mode = m;
        elMode.textContent = MODE_NAMES[m];
        seedHomes(false);
        pulse(ptr.inside ? ptr.x : P.x, ptr.inside ? ptr.y : P.y);
        markBusy(2600);   // 粒子归位需要一段时间，期间保持全帧率
      }

      /* ================= 交互 ================= */

      var lastClickT = 0, lastClickX = 0, lastClickY = 0;

      window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      window.addEventListener('pointermove', function (e) {
        if (!ptr.seen) {
          ptr.seen = true;
          ptr.lastX = e.clientX;
          ptr.lastY = e.clientY;
        }
        ptr.x = e.clientX;
        ptr.y = e.clientY;
        ptr.inside = true;
        ptr.nx = (e.clientX / W - 0.5) * 2;
        ptr.ny = (e.clientY / H - 0.5) * 2;

        var dx = e.clientX - ptr.lastX;
        ptr.lastX = e.clientX;
        ptr.lastY = e.clientY;

        if (ptr.down) {
          ptr.swirl = clamp(ptr.swirl + dx * 7, -1500, 1500);
          P.momentum = clamp(P.momentum + dx * 0.0009, -0.3, 0.3);
        } else {
          ptr.swirl = clamp(ptr.swirl + dx * 1.1, -300, 300);
        }

        wakeHud();
      });

      window.addEventListener('pointerdown', function (e) {
        ptr.down = true;
        if (e.button === 2) ptr.right = true; else ptr.left = true;
        ptr.lastX = e.clientX;
        ptr.lastY = e.clientY;
        ptr.downX = e.clientX;
        ptr.downY = e.clientY;
        ptr.downT = performance.now();
        ptr.x = e.clientX;
        ptr.y = e.clientY;
        ptr.inside = true;
        document.body.classList.add('grabbing');
        wakeHud();
      });

      window.addEventListener('pointerup', function (e) {
        if (e.button === 2) ptr.right = false; else ptr.left = false;

        var dist = Math.hypot(e.clientX - ptr.downX, e.clientY - ptr.downY);
        var held = performance.now() - ptr.downT;
        if (dist < 9 && held < 450 && e.button !== 2) {
          var now = performance.now();
          var dbl = now - lastClickT < 360 &&
            Math.hypot(e.clientX - lastClickX, e.clientY - lastClickY) < 70;

          var hit = bodyHit(e.clientX, e.clientY);
          if (dbl && ptr.overRing) {
            burst(e.clientX, e.clientY);
            lastClickT = 0;
          } else if (hit) {
            // 点中小星体：局部点亮，同一目标再次点击时重新开始，不叠加亮度
            for (var bi = bodyGlows.length - 1; bi >= 0; bi--) {
              if (bodyGlows[bi].key === hit.key) bodyGlows.splice(bi, 1);
            }
            bodyGlows.push({
              key: hit.key,
              x: hit.x, y: hit.y, r: hit.r,
              lx: e.clientX - hit.x, ly: e.clientY - hit.y,
              t: 0, life: 1.1, tint: hit.tint
            });
            spawnSparks(hit.x, hit.y, 8, 22, 110);
            lastClickT = now;
            lastClickX = e.clientX;
            lastClickY = e.clientY;
          } else {
            pulse(e.clientX, e.clientY);
            lastClickT = now;
            lastClickX = e.clientX;
            lastClickY = e.clientY;
          }
        }

        if (!ptr.left && !ptr.right) {
          ptr.down = false;
          document.body.classList.remove('grabbing');
        }
      });

      window.addEventListener('pointerleave', function () {
        if (!ptr.down) {
          ptr.inside = false;
          ptr.swirl = 0;
        }
      });

      window.addEventListener('wheel', function (e) {
        e.preventDefault();
        gravity = clamp(gravity * (e.deltaY > 0 ? 0.92 : 1.08), 0.2, 3.5);
        elG.textContent = gravity.toFixed(2);
        wakeHud();
      }, { passive: false });

      window.addEventListener('keydown', function (e) {
        var k = e.key.toLowerCase();

        if (k === ' ') {
          e.preventDefault();
          gathered = !gathered;
          elState.textContent = gathered ? '聚拢' : '散开';
          pulse(ptr.inside ? ptr.x : P.x, ptr.inside ? ptr.y : P.y);
        } else if (k === '1') setMode(0);
        else if (k === '2') setMode(1);
        else if (k === '3') setMode(2);
        else if (k === 'r') {
          seedHomes(false);
          pulse(P.x, P.y);
          markBusy(2200);
        } else if (k === 't') {
          trails = !trails;
        } else if (k === 'f') {
          if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
          } else if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        } else if (k === 'h') {
          hudLocked = !hudLocked;
          clearTimeout(hudTimer);
          hud.classList.toggle('hidden', hudLocked);
          if (!hudLocked) wakeHud();
        } else if (k === 'a' || k === 'arrowleft') {
          P.momentum = clamp(P.momentum + 0.055, -0.35, 0.35);
        } else if (k === 'd' || k === 'arrowright') {
          P.momentum = clamp(P.momentum - 0.055, -0.35, 0.35);
        } else if (k === '+' || k === '=') {
          gravity = clamp(gravity * 1.1, 0.2, 3.5);
          elG.textContent = gravity.toFixed(2);
        } else if (k === '-' || k === '_') {
          gravity = clamp(gravity * 0.9, 0.2, 3.5);
          elG.textContent = gravity.toFixed(2);
        }

        wakeHud();
      });

      window.addEventListener('blur', function () {
        ptr.left = false;
        ptr.right = false;
        ptr.down = false;
        ptr.swirl = 0;
        document.body.classList.remove('grabbing');
      });

      var resizeTimer = 0;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layout, 170);
      });

      /* ================= 启动 ================= */

      buildPalette();
      starSprite = makeStarSprite();
      planetTex = buildPlanetTexture();
      moonTex = buildMoonTexture();
      for (var mi0 = 0; mi0 < MOONS.length; mi0++) moonSprites.push(buildMoonSprite(MOONS[mi0].tint));
      marsTex = buildMarsTexture();
      buildStaticSprites();
      layout();
      tickClock();
      setInterval(tickClock, 1000);
      wakeHud();
      last = performance.now();
      requestAnimationFrame(loop);
    })();
  </script>
